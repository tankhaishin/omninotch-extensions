name: Check extensions
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changed extensions
        id: changed
        run: |
          dirs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- extensions | cut -d/ -f1-3 | sort -u)
          echo "dirs<<EOF" >> $GITHUB_OUTPUT; echo "$dirs" >> $GITHUB_OUTPUT; echo "EOF" >> $GITHUB_OUTPUT
      - name: Only your own folder
        env: { AUTHOR: "${{ github.event.pull_request.user.login }}" }
        run: |
          for d in ${{ steps.changed.outputs.dirs }}; do
            owner=$(echo "$d" | cut -d/ -f2)
            if [ "$owner" != "$(echo "$AUTHOR" | tr '[:upper:]' '[:lower:]')" ] && [ "$AUTHOR" != "tankhaishin" ]; then
              echo "::error::$d belongs to $owner; put your extension under extensions/$AUTHOR/"; exit 1
            fi
          done
      - name: Run each extension like OmniNotch does
        run: |
          dirs="${{ steps.changed.outputs.dirs }}"
          [ -z "$dirs" ] && { echo "No extension changed."; exit 0; }
          for d in $dirs; do [ -d "$d" ] && tools/check-extension "$d"; done
